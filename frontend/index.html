<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetrofitLogic | Legacy Computational Solutions</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Google Fonts for IBM Mid-century look and MS-DOS monospace -->
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body class="phase-1">
    
    <!-- PHASE 1: RETROFIT LOGIC CORPORATE FACADE (1960s IBM / Teakwood) -->
    <main id="corporate-ui" class="active">
        <div class="teak-border"></div>
        <div class="corporate-container">
            <header class="corp-header">
                <div class="logo-grid">
                    <div class="logo-mark">R</div>
                    <h1 class="logo-text">RetrofitLogic.</h1>
                </div>
                <nav class="corp-nav">
                    <a href="#">Solutions</a>
                    <a href="#">Methodology</a>
                    <a href="#">About</a>
                </nav>
            </header>

            <section class="hero">
                <div class="grid-overlay"></div>
                <div class="hero-content">
                    <h2>Trust Through Precision.</h2>
                    <p>Providing heavy-duty computational content engines for the modern enterprise. We merge atomic-age reliability with cutting-edge market intelligence.</p>
                    
                    <button id="login-btn" class="access-btn">Access Portal <span>&#8594;</span></button>
                </div>
                <div class="hero-graphic">
                    <!-- Geometric 60s illustration abstraction -->
                    <div class="geo-circle"></div>
                    <div class="geo-rect"></div>
                    <div class="geo-line"></div>
                </div>
            </section>
        </div>
        <div class="teak-border-bottom"></div>
    </main>

    <!-- CRT GLITCH OVERLAY (Transition) -->
    <div id="glitch-overlay"></div>

    <!-- PHASE 2: SERVICE-EXE TERMINAL (1980s MS-DOS / Glowing Green) -->
    <main id="terminal-ui" class="hidden">
        <div class="crt-scanlines"></div>
        <div class="terminal-content">
            <div id="boot-sequence"></div>
            <div class="input-line hidden" id="terminal-input">
                <span class="prompt">C:\SERVICE-EXE></span>
                <span class="cursor"></span>
            </div>
        </div>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
